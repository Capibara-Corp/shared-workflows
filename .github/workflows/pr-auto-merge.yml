name: Auto Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]
  check_run:
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    uses: Capibara-Corp/shared-workflows/.github/workflows/auto-merge.yml@v1
    secrets: inherit
